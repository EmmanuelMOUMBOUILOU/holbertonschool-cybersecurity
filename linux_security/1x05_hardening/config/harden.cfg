# Hardening Framework Configuration

# Logging
LOG_FILE="/var/log/hardening.log"

# Network policy
FIREWALL_RULES_FILE="/etc/hardening/firewall.rules"
SYSCTL_FILE="/etc/sysctl.conf"
SSH_PORT="22"
ALLOW_HTTP="yes"
ALLOW_HTTPS="yes"

# SSH policy
SSHD_CONFIG="/etc/ssh/sshd_config"
PASSWORD_AUTHENTICATION="no"
PUBKEY_AUTHENTICATION="yes"
PERMIT_ROOT_LOGIN="no"
ALLOWED_SSH_USERS=("student")

# Identity policy
PASS_MIN_LEN="12"
PASS_MAX_DAYS="90"
FAIL_LOCK_ATTEMPTS="5"
LOGIN_DEFS="/etc/login.defs"
PAM_PASSWORD_FILE="/etc/pam.d/common-password"
PAM_AUTH_FILE="/etc/pam.d/common-auth"
PAM_ACCOUNT_FILE="/etc/pam.d/common-account"
FAILLOCK_CONFIG="/etc/security/faillock.conf"
PRIVILEGED_GROUPS=("sudo" "wheel")
CLEANUP_UID_THRESHOLD="1000"

# System policy
BLOATWARE_PACKAGES=("telnet" "ftp" "netcat-traditional")
SECURITY_PACKAGES=("auditd" "fail2ban" "libpam-pwquality")
